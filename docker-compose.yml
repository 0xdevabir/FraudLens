services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudlens_dev}
      POSTGRES_DB: fraudlens
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlens -d fraudlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
