# `make up` starts Postgres and Redis for development on the host.
# `make demo` adds the `demo` profile: the API and the console in containers.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudlens_dev}
      POSTGRES_DB: fraudlens
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlens -d fraudlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # REDIS_PASSWORD (from the shell or a .env next to this file) turns on
    # authentication. Unset, Redis has none and relies on the loopback-only port.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Builds the dataset, the models and the database contents on its first start
  # (about ten minutes), then serves. Later starts go straight to serving.
  api:
    profiles: [demo]
    build: ./backend
    init: true
    env_file:
      - path: backend/.env # written by `make demo` if it is missing
        required: false
    environment:
      FRAUDLENS_DATABASE_URL: postgresql+psycopg://fraudlens:${POSTGRES_PASSWORD:-fraudlens_dev}@postgres:5432/fraudlens
      FRAUDLENS_REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # Only the TLS proxy's X-Forwarded-For is believed (its fixed address below).
      FRAUDLENS_TRUSTED_PROXIES: '["172.30.250.10/32"]'
    networks: [default, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - data:/app/data
      - artifacts:/app/artifacts
    healthcheck:
      # Healthy only once the build steps are over and the API answers.
      test: ["CMD", "python", "-m", "fraudlens.platform.demo", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2h
      start_interval: 10s

  console:
    profiles: [demo]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8010}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"
    networks: [default, edge]

  # `make tls`: HTTPS with HSTS in front of the API and the console (deploy/Caddyfile).
  proxy:
    profiles: [tls]
    image: caddy:2-alpine
    environment:
      FRAUDLENS_SITE: ${FRAUDLENS_SITE:-localhost}
    depends_on: [api, console]
    ports:
      - "127.0.0.1:${TLS_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    networks:
      edge:
        ipv4_address: 172.30.250.10

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.250.0/24

volumes:
  pgdata:
  data:
  artifacts:
  caddy:
