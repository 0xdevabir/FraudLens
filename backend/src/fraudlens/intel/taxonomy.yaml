# The eight kinds of fraud FraudLens names, as they happen to mobile-wallet
# customers in Bangladesh, and what the platform does about each.
#
# `advice` is the only text a customer is ever shown for a category. It is fixed
# here, in English and Bangla, the same way the policy's messages are: nothing a
# model writes reaches a customer.
#
# `detectors` says which parts of the platform see this category:
#   transaction  the transaction and recipient models, rules and the graph
#   text         the scam-message classifier (fraudlens.intel.text)
#   links        the link check (fraudlens.intel.links), fixed checks, not a model
#   ledger       the payment-proof check against recorded transactions

version: v1

categories:
  - id: social_engineering
    number: 1
    name: { en: Social engineering, bn: প্ররোচনামূলক প্রতারণা }
    summary: >-
      The fraudster talks the customer into sending money or sharing a secret
      code. The customer presses the buttons themselves, so a system that only
      checks who is signed in sees nothing wrong.
    bangladesh: >-
      It usually starts with a phone call: "bKash/Nagad/upay office theke
      bolchi, apnar account bondho hoye jabe" (I am calling from the
      bKash/Nagad/upay office, your account will be closed). The caller then
      asks for the OTP that has just arrived, or for the PIN "to verify". Other
      versions: a refund or cashback that needs the customer's code first; a
      relative "in hospital" writing from a new number; long romance or
      friendship chats on Facebook, IMO and WhatsApp that end with a gift
      "stuck at customs". Callers often learn the victim's number and last
      payment amount from an agent's register, or from someone standing nearby.
    examples: [fake support call, OTP theft, PIN theft, romance scam, refund scam]
    detectors: [transaction, text]
    signals:
      - A first payment to a wallet the sender has never paid before, and the amount is large for this sender
      - A receiver that many unrelated strangers started paying this week
      - A message that asks for an OTP or PIN, or rushes the reader to act within minutes
    advice:
      en: >-
        upay never asks for your PIN or an OTP, by phone, SMS or chat. If someone
        is telling you what to press, hang up and call the helpline number shown
        inside the app yourself.
      bn: >-
        উপায় কখনো ফোন, এসএমএস বা চ্যাটে আপনার পিন বা ওটিপি চায় না। কেউ ফোনে কী
        চাপতে হবে বলে দিতে থাকলে ফোন কেটে দিন এবং অ্যাপে দেওয়া হেল্পলাইন নম্বরে
        নিজে ফোন করুন।

  - id: impersonation
    number: 2
    name: { en: Fake identity and impersonation, bn: ভুয়া পরিচয় ও ছদ্মবেশ }
    summary: >-
      The fraudster pretends to be someone the customer already trusts: the
      wallet company, an agent, a bank, a government office or a shop.
    bangladesh: >-
      Fake "customer care" numbers and Facebook pages copy a wallet's logo.
      They reply to people who complain in public comments. Some callers say
      they are the agent the customer just used, or a bank officer. Others say
      they are from an education board, or from a social-safety programme that
      pays a stipend (উপবৃত্তি) or an allowance (ভাতা). Fake shop pages use the
      name of a well-known shop. The number they use is almost always an
      ordinary personal mobile number.
    examples: [fake customer care, fake agent, fake support page, fake merchant]
    detectors: [transaction, text, links]
    signals:
      - A message that says it comes from the wallet company, a bank or a government office
      - A "helpline" that is a personal mobile number, or a web page on an address made to look like the real one
      - Many people paying one personal wallet for the first time
    advice:
      en: >-
        This looks like someone pretending to be upay, an agent or an official.
        Real staff do not call from personal numbers to ask for codes or money.
        Use only the helpline and links inside the app.
      bn: >-
        মনে হচ্ছে কেউ উপায়, এজেন্ট বা সরকারি কর্মকর্তা সেজে যোগাযোগ করছে। প্রকৃত
        কর্মকর্তারা ব্যক্তিগত নম্বর থেকে ফোন করে কোড বা টাকা চান না। শুধু অ্যাপের
        ভেতরের হেল্পলাইন ও লিংক ব্যবহার করুন।

  - id: fake_payment
    number: 3
    name: { en: Fake payment and transaction, bn: ভুয়া পেমেন্ট ও লেনদেন }
    summary: >-
      The fraudster makes it look as if money was sent when it was not. The
      victim then hands over goods, or "returns" money that never arrived.
    bangladesh: >-
      "Bhai, vul kore apnar number e taka chole geche, ferot din" (Brother,
      money went to your number by mistake, please send it back). This comes as
      an SMS that copies a cash-in notice, sent from a personal number, and then
      a call asking for the money back. Shopkeepers and Facebook sellers are
      shown an edited screenshot of a "successful" payment and asked to hand
      over the goods. Fake refund and reversal notices work the same way. The
      notice never comes from the wallet's own sender name, and the balance
      does not change.
    examples: [fake screenshot, fake SMS, fake refund, transaction manipulation]
    detectors: [ledger, text]
    signals:
      - A transaction ID that is not in our records, or that was not sent to this wallet
      - An amount that is different from the one in our records
      - A message asking to send back money "sent by mistake"
    advice:
      en: >-
        Check your own balance and transaction list before you return money or
        hand over goods. An SMS or a screenshot is not proof. A real payment
        appears in your upay history.
      bn: >-
        টাকা ফেরত দেওয়ার বা পণ্য বুঝিয়ে দেওয়ার আগে নিজের ব্যালেন্স ও লেনদেনের
        তালিকা দেখে নিন। এসএমএস বা স্ক্রিনশট কোনো প্রমাণ নয়। প্রকৃত পেমেন্ট আপনার
        উপায় লেনদেনের তালিকায় দেখা যায়।

  - id: account_takeover
    number: 4
    name: { en: Account and identity takeover, bn: অ্যাকাউন্ট ও পরিচয় দখল }
    summary: >-
      Someone else gets into the customer's wallet and moves the money out
      themselves.
    bangladesh: >-
      A scam call collects the OTP and PIN. The fraudster uses them to register
      the wallet on their own phone. The balance is gone within minutes,
      usually sent to a mule wallet (a wallet used to pass stolen money on) and
      then cashed out at an agent in another district. Other ways in: a SIM
      replaced or re-registered with someone else's ID papers; a stolen or
      borrowed phone where the PIN was written down or guessed; and
      remote-control apps the customer was told to install.
    examples: [OTP theft, PIN theft, SIM fraud, stolen phone, account takeover]
    detectors: [transaction, text]
    signals:
      - A phone that has been on the wallet for minutes, not months
      - A payment that empties the balance, from a district or mobile network the wallet never uses
      - A message that asks for a code, a SIM change or registering a new phone
    advice:
      en: >-
        Someone may be trying to get into your wallet. Do not share any code,
        change your PIN now, and tell upay from inside the app if your SIM
        stopped working or your phone is missing.
      bn: >-
        কেউ আপনার ওয়ালেটে ঢোকার চেষ্টা করতে পারে। কোনো কোড কাউকে দেবেন না, এখনই
        পিন পরিবর্তন করুন, এবং সিম বন্ধ হয়ে গেলে বা ফোন হারিয়ে গেলে অ্যাপ থেকে
        উপায়কে জানান।

  - id: merchant_fraud
    number: 5
    name: { en: Marketplace and merchant fraud, bn: মার্কেটপ্লেস ও মার্চেন্ট প্রতারণা }
    summary: >-
      Fraud in buying and selling: goods that never arrive, sellers who are not
      real sellers, and buyers who never paid.
    bangladesh: >-
      Facebook page shops (F-commerce) and online listings ask for the full
      price, or a "booking" or "delivery charge", in advance to a personal
      wallet. Then they block the buyer. Big-discount pre-order schemes collect
      advance payments for months. In second-hand listings for phones and
      motorbikes, the "seller" is in another district and wants a courier fee
      first. Sellers are also targeted the other way round, with fake payment
      proofs (type 3).
    examples: [fake e-commerce, marketplace scam, advance payment, fake merchant]
    detectors: [text, transaction]
    signals:
      - An advance payment asked to a personal wallet instead of a merchant account
      - A price far below the market price, with a deadline
      - One personal wallet getting first-time payments from buyers all over the country
    advice:
      en: >-
        Be careful with advance payments. Prefer cash on delivery or a merchant
        payment, and do not send the full price to a personal number for goods
        you have not seen.
      bn: >-
        অগ্রিম টাকা পাঠানোর আগে সতর্ক থাকুন। ক্যাশ অন ডেলিভারি বা মার্চেন্ট পেমেন্ট
        বেছে নিন, এবং না দেখা পণ্যের জন্য ব্যক্তিগত নম্বরে পুরো দাম পাঠাবেন না।

  - id: phishing_malware
    number: 6
    name: { en: Phishing and malicious technology, bn: ফিশিং ও ক্ষতিকর প্রযুক্তি }
    summary: >-
      Links, apps and QR codes made to steal a wallet's login details, or to
      take control of the phone.
    bangladesh: >-
      Links sent by SMS, Messenger and WhatsApp lead to pages that copy a
      wallet's login page or a "KYC update" (identity details) form. "Update"
      or "offer" apps are sent as .apk files, outside the Play Store. Callers
      ask the customer to install AnyDesk or TeamViewer "so the officer can fix
      the account". Some QR codes are said to be for receiving money, but they
      open a payment to the fraudster instead.
    examples: [phishing links, malicious APK, fake QR, remote access]
    detectors: [links, text]
    signals:
      - A wallet's name on a web address that does not belong to that wallet
      - A shortened link, a link that is only numbers (an IP address), or an .apk download
      - A request to install a remote-control app, or to scan a code "to receive" money
    advice:
      en: >-
        Do not open this link or install anything it offers. upay is only in the
        official app from the app store; scanning a QR code or entering your PIN
        is never needed to receive money.
      bn: >-
        এই লিংক খুলবেন না এবং এখান থেকে কিছু ইনস্টল করবেন না। উপায় শুধু অ্যাপ
        স্টোরের অফিসিয়াল অ্যাপেই আছে; টাকা গ্রহণ করতে কখনো কিউআর কোড স্ক্যান বা
        পিন দেওয়ার প্রয়োজন হয় না।

  - id: financial_network
    number: 7
    name: { en: Transaction and financial network fraud, bn: লেনদেন ও আর্থিক নেটওয়ার্ক প্রতারণা }
    summary: >-
      What happens to stolen money next: it is passed through wallets that
      exist only to receive it, then turned into cash before anyone can stop it.
    bangladesh: >-
      Mule wallets are opened with other people's ID documents, or rented from
      students and day labourers for a small commission. Money from many
      victims lands in one wallet. It is passed on through one or two more
      wallets, then cashed out at agent points within minutes, often far from
      where the victims live. Online betting money and informal remittance
      (hundi) money move the same way.
    examples: [mule accounts, layered transfers, rapid cash-out, abnormal transactions]
    detectors: [transaction, text]
    signals:
      - Many unrelated senders, then almost everything received is quickly passed on or cashed out
      - Wallets that share one phone, or pass money around in a circle
      - A message offering to rent a wallet, or to "receive and forward" money for a commission
    advice:
      en: >-
        Never let anyone use your wallet to receive or pass on money, whatever
        commission is offered. The wallet is in your name and you answer for
        what moves through it.
      bn: >-
        কমিশনের লোভে কাউকে আপনার ওয়ালেট দিয়ে টাকা গ্রহণ বা পাঠাতে দেবেন না।
        ওয়ালেটটি আপনার নামে, এর লেনদেনের দায়ও আপনার।

  - id: scam_campaign
    number: 8
    name: { en: Scam campaigns, bn: সংঘবদ্ধ প্রতারণা প্রচারণা }
    summary: >-
      One script sent to many people: a prize, an investment return, a job, a
      loan or a donation. Each victim pays a small "fee", and the fees add up.
    bangladesh: >-
      "Apni 25 lakh taka lottery jitechen" (You have won a 25 lakh taka
      lottery), with a registration or VAT fee to pay first. Trading and MLM
      apps promise a daily profit, until withdrawals stop. Part-time "like and
      subscribe" jobs on Telegram and WhatsApp pay a few taka, then ask for a
      deposit to unlock bigger tasks. Instant-loan apps charge a processing fee
      and never give the loan. Also: stipend, allowance and remittance-bonus
      messages, fake cashback offers, and charity appeals after floods and
      during Ramadan.
    examples: [lottery, investment, job, loan, charity, fake cashback, fake remittance]
    detectors: [transaction, text]
    signals:
      - Many strangers sending small, fee-sized payments to one wallet
      - A customer sending bigger and bigger amounts to the same new receiver
      - A message promising money if a fee is paid first
    advice:
      en: >-
        A prize, a job, a loan or an investment that asks you to pay first is a
        scam. Do not send a fee, a deposit or a tax to receive money.
      bn: >-
        যে পুরস্কার, চাকরি, ঋণ বা বিনিয়োগে আগে টাকা দিতে হয়, তা প্রতারণা। টাকা
        পাওয়ার জন্য কোনো ফি, জামানত বা কর পাঠাবেন না।

# Shown when a message looks like a scam but no category is clear enough to name.
general_advice:
  en: >-
    This message has the marks of a scam. Do not send money, share a code or
    open links from it until you have checked with upay inside the app.
  bn: >-
    এই বার্তায় প্রতারণার লক্ষণ আছে। অ্যাপের ভেতর থেকে উপায়ের সাথে যাচাই না করে
    টাকা পাঠাবেন না, কোড দেবেন না এবং এর লিংক খুলবেন না।

# How the names the rest of the platform already uses map onto the categories.
# Typologies are the simulator's (and the similar-case index's); scenarios are the
# decision engine's; report categories are what a customer picks.
typologies:
  impersonation: [social_engineering, impersonation]
  wrong_send: [social_engineering, fake_payment]
  lottery_fee: [social_engineering, scam_campaign]
  investment_scam: [social_engineering, scam_campaign]
  account_takeover: [account_takeover]

scenarios:
  scam: [social_engineering]
  takeover: [account_takeover]
  unusual_access: [account_takeover]
  cash_out: [financial_network]

report_categories:
  impersonation: [social_engineering, impersonation]
  prize_or_lottery: [scam_campaign]
  investment: [scam_campaign]
  account_takeover: [account_takeover]
  wrong_send: [fake_payment]
  fake_payment: [fake_payment]
  merchant_or_marketplace: [merchant_fraud]
  phishing_link_or_app: [phishing_malware]
  job_or_loan: [scam_campaign]
  other: []

# Domains each brand really uses. A brand's name on any other domain is a
# look-alike. This list is configuration, to be kept by whoever runs the platform.
brands:
  upay: [upaybd.com]
  bkash: [bkash.com]
  nagad: [nagad.com.bd]

# What a customer is told after asking whether a payment really arrived. The
# answer comes from the ledger, never from the message or screenshot they were shown.
proof_messages:
  verified:
    en: >-
      This payment is in your account: the amount matches and it is complete.
    bn: >-
      এই পেমেন্টটি আপনার অ্যাকাউন্টে এসেছে: টাকার পরিমাণ মিলেছে এবং লেনদেন সম্পন্ন হয়েছে।
  mismatch:
    en: >-
      We found this transaction, but it does not match what you were told.
      Do not hand over goods or send money back until your balance shows it.
    bn: >-
      লেনদেনটি পাওয়া গেছে, কিন্তু আপনাকে যা বলা হয়েছে তার সাথে মিলছে না। ব্যালেন্সে
      টাকা না দেখা পর্যন্ত পণ্য দেবেন না বা টাকা ফেরত পাঠাবেন না।
  not_found:
    en: >-
      No such payment has reached your account. A screenshot or an SMS can be
      faked. Do not hand over goods or send money back; check your balance in the app.
    bn: >-
      এমন কোনো পেমেন্ট আপনার অ্যাকাউন্টে আসেনি। স্ক্রিনশট বা এসএমএস নকল করা যায়।
      পণ্য দেবেন না বা টাকা ফেরত পাঠাবেন না; অ্যাপে আপনার ব্যালেন্স দেখে নিন।
