# Message scripts the scam-message classifier is trained and tested on.
#
# Every line is written for this project. None is a real message from a real
# person: they are modelled on the scripts fraud teams and news reports describe
# in Bangladesh, in the three ways people actually write (bn: Bangla script,
# bl: Bangla in Latin letters, en: English).
#
# A family is one script. `labels` are taxonomy category ids; a family without
# labels is ordinary, harmless text. `hard: true` marks harmless text that
# shares words with scams (a real OTP notice, a parent asked for money).
# `held_out: true` families are never trained on: they measure what the model
# does with a script it has not met.
#
# Slots in braces are filled by fraudlens.intel.corpus.

families:
  # ------------------------------------------------------------------ scams
  - id: otp_call_block
    labels: [social_engineering, impersonation, account_takeover]
    templates:
      - [bl, "{brand} office theke bolchi. apnar account e somossa hoyeche, block hoye jabe. apnar phone e ekta OTP geche, seta bolun"]
      - [bl, "Sir ami {brand} head office theke {name} bolchi, apnar account update korte hobe, sms e je 6 digit code ta gese oita bolen taratari"]
      - [bn, "{brand_bn} হেড অফিস থেকে বলছি। আপনার অ্যাকাউন্টটি সাময়িকভাবে বন্ধ করা হয়েছে। চালু করতে আপনার ফোনে যাওয়া ওটিপি কোডটি বলুন।"]
      - [bn, "আপনার {brand_bn} অ্যাকাউন্টে সমস্যা হয়েছে, এখনই ভেরিফাই না করলে ব্লক হয়ে যাবে। মেসেজে আসা ৬ সংখ্যার কোডটি দিন।"]
      - [en, "This is {brand} customer service. Your account will be blocked today. Tell me the verification code we just sent to your phone to keep it active."]
      - [en, "Dear customer, your {brand} wallet is under review. Share the OTP you received within 5 minutes or the account will be closed permanently."]
      - [bl, "apnar {brand} account ta block hoye gese, thik korte hole ekhon je code jabe oita amake bolun, na hole taka sob kete jabe"]

  - id: pin_verify
    labels: [social_engineering, impersonation, account_takeover]
    templates:
      - [bl, "{brand} theke bolchi, apnar account verify korar jonno PIN number ta bolun, na hole account bondho hoye jabe"]
      - [bn, "আপনার {brand_bn} অ্যাকাউন্টের তথ্য হালনাগাদ করতে হবে। আপনার পিন নম্বর এবং জন্ম তারিখ বলুন।"]
      - [en, "We are updating our system. Confirm your {brand} PIN and NID number now to avoid suspension of your wallet."]
      - [bl, "sir apnar account e {amt} taka bonus add hobe, confirm korte apnar pin ta ekbar bolen"]
      - [bn, "{brand_bn} কাস্টমার কেয়ার থেকে বলছি। আপনার অ্যাকাউন্ট সচল রাখতে পিন নম্বরের সাথে {otp} যোগ করে যে সংখ্যা হয় সেটি বলুন।"]
      - [en, "For security verification please type your {brand} PIN followed by the code {otp} and send it to this number."]
      - [bl, "apnar pin er sathe {otp} jog kore je sonkha hoy seta bolun, tahole apnar account abar chalu hoye jabe"]

  - id: refund_code
    labels: [social_engineering, impersonation]
    templates:
      - [bl, "apnar {brand} account e {amt} taka refund asbe, refund pete phone e asa code ta amake din"]
      - [bn, "আপনার একটি লেনদেন ব্যর্থ হয়েছে, {amt_bn} টাকা ফেরত দেওয়া হবে। ফেরত পেতে আপনার মোবাইলে আসা কোডটি জানান।"]
      - [en, "You are eligible for a refund of Tk {amt}. To process it, reply with the code sent to your number."]
      - [bl, "sir apnar cashback {amt} tk pending ase, ami pathiye dicchi, sudhu sms er code ta bolen"]
      - [bn, "{brand_bn} থেকে আপনার ক্যাশব্যাকের {amt_bn} টাকা আটকে আছে। ছাড়াতে এখনই কোডটি বলুন, নইলে বাতিল হয়ে যাবে।"]
      - [en, "Your cashback of BDT {amt} is on hold. Our officer will call you, give him the 6 digit code to release it."]

  - id: relative_emergency
    labels: [social_engineering]
    templates:
      - [bl, "Ammu ami {name}, amar phone nosto, eta notun number. khub bipode asi, ei number e {amt} taka bkash koro ekhoni"]
      - [bn, "আব্বা আমি {name_bn}, আমার ফোন হারিয়ে গেছে, এটা বন্ধুর নম্বর। হাসপাতালে আছি, এখনই {num_bn} নম্বরে {amt_bn} টাকা পাঠান, পরে সব বলব।"]
      - [en, "Hi it's me, I lost my phone and this is a new number. I'm in trouble, please send {amt} taka to {num} right now, don't call, I'll explain later."]
      - [bl, "vai ami accident korsi hospital e, kauke bolo na, {num} ei number e {amt} tk pathao joldi"]
      - [bn, "মামা আমি পুলিশের কাছে আটকা পড়েছি, কাউকে বলবেন না। {amt_bn} টাকা এই নম্বরে এখনই পাঠান, নইলে বড় বিপদ হবে।"]
      - [en, "Mom my number changed. I need {amt} urgently for a hospital bill, send it to {num}, this is my friend's {brand}. Please hurry."]

  - id: romance_gift
    labels: [social_engineering]
    templates:
      - [en, "My love, I have sent you a gift box with gold and dollars. The courier needs {amt} taka clearance, please send it to {num} today."]
      - [bl, "jaan ami tomar jonno bidesh theke gift pathiyechi, customs e atke ase, charate {amt} taka lagbe, ei number e pathao {num}"]
      - [bn, "প্রিয়, তোমার জন্য বিদেশ থেকে দামি উপহার পাঠিয়েছি। কাস্টমসে আটকে আছে, ছাড়াতে {amt_bn} টাকা {num_bn} নম্বরে পাঠাও।"]
      - [en, "Dear, I am a doctor working abroad. I want to visit you but my account is frozen, lend me {amt} taka on {brand} and I will return double."]
      - [bl, "ami tomake onek valobashi, ekta problem e porsi, {amt} tk dhar dao, kal e ferot dibo, {num} e pathao"]
      - [bn, "তোমাকে ছাড়া আর কাউকে বলতে পারছি না। আমার মায়ের অপারেশন, {amt_bn} টাকা দরকার, বিকাশ করে দাও, আমি এসে ফেরত দেব।"]

  - id: fake_helpline
    labels: [impersonation, social_engineering]
    templates:
      - [bn, "{brand_bn} কাস্টমার কেয়ার হেল্পলাইন {num_bn}। যেকোনো সমস্যায় ২৪ ঘণ্টা এই নম্বরে কল করুন অথবা ইনবক্স করুন।"]
      - [bl, "{brand} customer care number {num}. taka ferot, account unblock, pin reset sob somossar somadhan, call korun"]
      - [en, "{brand} Official Support Team. Wrong transaction? Account locked? Call or WhatsApp our agent at {num} for instant help."]
      - [bn, "আপনার অভিযোগটি আমরা দেখেছি। দ্রুত সমাধানের জন্য আমাদের {brand_bn} প্রতিনিধির সাথে {num_bn} নম্বরে যোগাযোগ করুন।"]
      - [en, "We saw your complaint about {brand}. Please inbox your wallet number and contact our help desk officer on {num}."]
      - [bl, "apnar complain ta peyechi. {brand} support officer er sathe kotha bolte {num} e call din, inbox e wallet number din"]

  - id: fake_agent
    labels: [impersonation, social_engineering, fake_payment]
    templates:
      - [bl, "vai ami agent, apni ektu age amar dokan theke cash in korsilen. vul kore {amt} taka beshi chole geche, taka ta ferot pathan"]
      - [bn, "আমি এজেন্ট বলছি। আপনি একটু আগে ক্যাশ ইন করেছেন, কিন্তু সার্ভার সমস্যায় টাকাটা ঝুলে আছে। ঠিক করতে আপনার ফোনে যাওয়া কোডটি বলুন।"]
      - [en, "I am the agent from the shop where you cashed in. By mistake I sent {amt} extra to your wallet, please return it to {num}."]
      - [bl, "ami {brand} agent bolchi, apnar cash in ta duibar hoye gese, {amt} taka back koren, na hole apnar account block kore dibo"]
      - [bn, "ভাই আমি এজেন্ট, আপনার নম্বরে ভুলে {amt_bn} টাকা ঢুকে গেছে। গরিব মানুষ, টাকাটা এই নম্বরে ফেরত দিন {num_bn}।"]
      - [en, "Agent here. Your cash in is stuck in the system. To release it I need the code that just came to your phone."]

  - id: govt_stipend
    labels: [impersonation, scam_campaign, social_engineering]
    templates:
      - [bn, "শিক্ষা বোর্ড থেকে বলছি। আপনার সন্তানের উপবৃত্তির {amt_bn} টাকা এসেছে। টাকা পেতে আপনার {brand_bn} নম্বর ও পিন বলুন।"]
      - [bl, "shikkha board theke bolchi, apnar meyer upobrittir {amt} taka asche, taka pete apnar {brand} pin ar code ta bolun"]
      - [bn, "সমাজসেবা অধিদপ্তর থেকে আপনার বয়স্ক ভাতার টাকা পাঠানো হবে। নিশ্চিত করতে মোবাইলে আসা কোডটি এখনই জানান।"]
      - [en, "Education board notice: your stipend of Tk {amt} is ready. To receive it send a registration fee of Tk {fee} to {num}."]
      - [bl, "apnar boyosko vatar taka asche, receive korte {fee} taka charge ei number e pathan {num}"]
      - [bn, "সরকারি ত্রাণ তহবিল থেকে আপনি {amt_bn} টাকা অনুদান পেয়েছেন। টাকা তুলতে {fee_bn} টাকা ফি এই নম্বরে পাঠান।"]
      - [en, "Govt allowance department: Tk {amt} has been approved for you. Share your wallet PIN with our officer to receive the money."]

  - id: wrong_send
    labels: [fake_payment, social_engineering]
    templates:
      - [bl, "vai vul kore apnar number e {amt} taka chole geche, doya kore ferot din ei number e {num}"]
      - [bn, "ভাই ভুল করে আপনার নম্বরে {amt_bn} টাকা চলে গেছে। আমি গরিব মানুষ, দয়া করে টাকাটা ফেরত পাঠান।"]
      - [en, "Hello, I sent {amt} taka to your number by mistake. It was for my mother's medicine. Please send it back to {num}."]
      - [en, "You have received Tk {amt}.00 from {num}. Balance updated. TrxID {trx}. Sent by mistake, kindly return to sender now."]
      - [bl, "apnar {brand} e {amt} tk vul kore pathiye disi, msg dekhen, taka ta back koren pls, na hole thanay jabo"]
      - [bn, "Cash In Tk {amt} সফল হয়েছে। TrxID {trx}। ভাই এটা ভুলে গেছে, এখনই এই নম্বরে ফেরত দিন, নইলে মামলা করব।"]
      - [bl, "apu amar baba r oshudh er taka vul e apnar nambar e chole gese {amt} taka, ektu ferot den na pls"]

  - id: screenshot_pressure
    labels: [fake_payment, merchant_fraud]
    templates:
      - [bl, "vai payment kore disi, screenshot dekhen. balance e ektu pore add hobe, server problem. product ta ekhoni pathiye din"]
      - [bn, "পেমেন্ট করে দিয়েছি, স্ক্রিনশট পাঠালাম। আপনার ব্যালেন্সে একটু পরে যোগ হবে, এখনই পণ্য দিয়ে দিন, আমার গাড়ি ছেড়ে দিচ্ছে।"]
      - [en, "Payment done, see the screenshot. It may take an hour to show in your balance because of a server issue, please hand over the goods now."]
      - [bl, "taka pathano hoye gese, sms asbe pore, network slow. apni mal ta rider er kase diye den taratari"]
      - [en, "I already paid {amt} by {brand}, the SMS is delayed. Don't check the app, just trust the screenshot and release the order."]
      - [bn, "টাকা পাঠিয়ে দিয়েছি, মেসেজ আসতে দেরি হবে। অ্যাপে চেক করার দরকার নেই, স্ক্রিনশটই প্রমাণ, মাল ছেড়ে দিন।"]

  - id: fake_reversal
    labels: [fake_payment, social_engineering]
    templates:
      - [en, "Your transaction {trx} of Tk {amt} has failed and the amount is on hold. To reverse it, send the same amount again to {num}."]
      - [bl, "apnar transaction fail hoyeche, taka atke ase. taka ferot pete abar {amt} taka ei number e send korun, duita eksathe ferot paben"]
      - [bn, "আপনার লেনদেনটি অসম্পূর্ণ রয়েছে। টাকা ফেরত পেতে আবার {amt_bn} টাকা পাঠান, দুই লেনদেনের টাকা একসাথে ফেরত দেওয়া হবে।"]
      - [en, "Refund notice: Tk {amt} will be returned to your wallet after you pay a reversal charge of Tk {fee} to {num}."]
      - [bl, "apnar taka vul account e chole gese, reverse korte {fee} tk charge lagbe, ei number e pathan"]
      - [bn, "আপনার টাকা ভুল নম্বরে চলে গেছে বলে অভিযোগ পেয়েছি। ফেরত আনতে {fee_bn} টাকা সার্ভিস চার্জ পাঠান।"]

  - id: sim_upgrade
    labels: [account_takeover, social_engineering, impersonation]
    templates:
      - [bl, "apnar SIM ta 4G te upgrade korte hobe, na hole bondho hoye jabe. phone e je code jabe seta bolun"]
      - [bn, "গ্রাহক সেবা থেকে বলছি। আপনার সিমের বায়োমেট্রিক নিবন্ধনে সমস্যা আছে, সিম বন্ধ হয়ে যাবে। চালু রাখতে কোডটি বলুন।"]
      - [en, "Telecom operator notice: your SIM registration has expired. Dial the code we tell you and share the confirmation number to keep your SIM active."]
      - [bl, "apnar sim re-registration korte hobe, NID number ar sms e asa code ta den, na hole 2 ghontar moddhe sim off"]
      - [bn, "আপনার সিমটি ফোরজি থেকে ফাইভজি করা হচ্ছে। কিছুক্ষণ ফোন বন্ধ রাখুন এবং তার আগে এসএমএসে আসা কোডটি জানান।"]
      - [en, "We are replacing your SIM with a new one for free. Keep your phone switched off for two hours and tell us the code you received."]

  - id: code_by_mistake
    labels: [account_takeover, social_engineering]
    templates:
      - [bl, "vai vul kore amar ekta code apnar number e chole gese, 6 digit er, ektu bolen na pls"]
      - [bn, "ভাই আমার একটা ভেরিফিকেশন কোড ভুল করে আপনার নম্বরে চলে গেছে, কোডটা একটু বলবেন?"]
      - [en, "Sorry, I typed your number by mistake while registering and the code went to you. Can you forward me the 6 digit code?"]
      - [bl, "apu amar {brand} er code ta apnar phone e gese vul e, forward kore den pls khub dorkar"]
      - [en, "A login code was sent to your phone in error. Please forward that message to this number so I can open my account."]
      - [bn, "আমার নতুন ফোনে অ্যাকাউন্ট চালু করছি, কোডটা ভুলে আপনার কাছে গেছে। মেসেজটা আমাকে ফরওয়ার্ড করে দিন।"]

  - id: advance_payment_shop
    labels: [merchant_fraud]
    templates:
      - [bn, "অর্ডার কনফার্ম করতে পুরো টাকা অগ্রিম {brand_bn} পার্সোনাল নম্বরে পাঠাতে হবে। ক্যাশ অন ডেলিভারি নেই।"]
      - [bl, "order confirm korte full payment advance korte hobe {num} personal number e. cash on delivery hobe na apu"]
      - [en, "To confirm your {item} order, send the full price in advance to our personal {brand} number {num}. No cash on delivery."]
      - [bl, "stock sesh hoye jacche, ekhoni {amt} taka advance send money koren {num} e, na hole order cancel"]
      - [bn, "{item_bn} বুকিং দিতে {amt_bn} টাকা অগ্রিম সেন্ড মানি করুন। টাকা না পাঠালে অর্ডার নেওয়া হবে না, স্টক সীমিত।"]
      - [en, "Limited stock! Pay Tk {amt} booking money now by send money to {num}. Delivery after full payment only."]

  - id: courier_fee_first
    labels: [merchant_fraud]
    templates:
      - [bl, "{item} ta ami courier e pathiye dibo, age courier charge {fee} taka pathan, ami onno jelay thaki"]
      - [bn, "{item_bn} বিক্রি হবে, আমি ঢাকার বাইরে থাকি। কুরিয়ারে পাঠাব, আগে কুরিয়ার চার্জ {fee_bn} টাকা পাঠিয়ে দিন।"]
      - [en, "The {item} is still available. I am posted out of town, so pay the delivery charge of Tk {fee} first and I will courier it today."]
      - [bl, "bike ta dekhte chaile age {fee} tk booking den, onek customer ase, na dile onno jon ke diye dibo"]
      - [en, "I am an army officer being transferred, selling my {item} cheap. Send Tk {fee} transport cost first and it will reach you tomorrow."]
      - [bn, "আমি সেনাবাহিনীতে চাকরি করি, বদলি হয়ে যাচ্ছি তাই {item_bn} কম দামে দিচ্ছি। পরিবহন খরচ {fee_bn} টাকা আগে পাঠান।"]

  - id: deep_discount
    labels: [merchant_fraud, scam_campaign]
    templates:
      - [bn, "ধামাকা অফার! {item_bn} মাত্র অর্ধেক দামে। আজই পুরো টাকা অগ্রিম দিয়ে অর্ডার করুন, ৪৫ দিনে ডেলিভারি।"]
      - [en, "Mega cyclone offer: {item} at 70% discount! Pay the full amount today, delivery in 45 working days. Hurry!"]
      - [bl, "{item} 60% discount e! aaj rat 12 tar moddhe full payment korle paben, delivery 30 din por"]
      - [en, "Flash sale for the first 100 buyers only. {item} for Tk {amt}. Advance payment required to {num}."]
