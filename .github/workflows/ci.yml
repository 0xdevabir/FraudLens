name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # The same ports and credentials as docker-compose.yml, which the settings default to.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraudlens
          POSTGRES_PASSWORD: fraudlens_dev
          POSTGRES_DB: fraudlens
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fraudlens -d fraudlens"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      # The platform tests skip themselves without Postgres and Redis; here that is a failure.
      - name: Tests
        run: |
          uv run pytest -q -rs | tee pytest.log
          ! grep -q "^SKIPPED" pytest.log

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      - run: pnpm build

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose --profile demo config --quiet
      - name: Build the demo images
        run: docker compose --profile demo build
